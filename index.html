    <style>
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Lato', sans-serif;
            color: #002fa7;
            background: transparent;
        }

        .background-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255,255,255,0.7);
            z-index: -1;
        }

        h1 {
            text-transform: uppercase;
            font-size: 24px;
            text-align: center;
            margin: 30px 0;
        }

        .project {
            text-align: center;
            margin-bottom: 40px;
        }

        .project-title {
            font-weight: bold;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .photos {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .photos img {
            width: 100%;
            max-width: 750px; /* augmenté de 25% (de 600px à 750px) */
            height: auto;
            cursor: pointer;
        }

        .transparent-image {
            display: block;
            margin: 50px auto 0 auto;
            width: 50%;
            max-width: 300px;
            opacity: 0.9;
        }
    </style>
</head>
