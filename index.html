<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Portfolio avec vidéos enchaînées et descriptions</title>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <style>
    body, html {
      margin: 0;
      padding: 0;
      font-family: 'Lato', sans-serif;
      color: #002fa7;
      background: transparent;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 160px;
      height: 100vh;
      background-color: transparent;
      padding: 20px 10px;
      font-size: 10px;
      overflow-y: auto;
      z-index: 10;
    }

    .sidebar a {
      display: block;
      color: #002fa7;
      text-decoration: none;
      margin-bottom: 6px;
      transition: opacity 0.2s ease;
    }

    .sidebar a:hover {
      opacity: 0.6;
    }

    .main {
      margin-left: 170px;
      padding: 30px 20px;
    }

    .video-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
    }

    .background-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 1s ease-in-out;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(255,255,255,0.7);
      z-index: -1;
    }

    h1 {
      text-transform: uppercase;
      font-size: 24px;
      text-align: center;
      margin: 30px 0;
    }

    .project {
      text-align: center;
      margin-bottom: 60px;
    }

    .project-title {
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .project-description {
      font-size: 33px;
      text-align: left;
      max-width: 800px;
      margin: 20px auto;
      font-weight: bold;
      font-variant: small-caps;
      text-transform: lowercase;
      font-feature-settings: 'lnum' 0;
      font-size-adjust: 0.5;
      line-height: 1.1;
    }

    .photos {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .photos img {
      width: 100%;
      max-width: 750px;
      height: auto;
      cursor: pointer;
    }

    .transparent-image {
      display: block;
      margin: 50px auto 0 auto;
      width: 50%;
      max-width: 300px;
      opacity: 0.9;
    }

    @media screen and (max-width: 768px) {
      .project-description {
        font-size: 18px;
        text-align: center;
        padding: 0 10px;
      }

      .sidebar {
        display: none;
      }

      h1 {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="sidebar" id="sidebar"></div>

  <div class="video-container">
    <video id="video1" class="background-video" autoplay muted playsinline></video>
    <video id="video2" class="background-video" muted playsinline style="opacity: 0;"></video>
  </div>
  <div class="overlay"></div>

  <div class="main">
    <h1>Bhaskara Architecture</h1>
