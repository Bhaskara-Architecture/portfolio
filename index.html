    body, html {
      margin: 0;
      padding: 0;
      font-family: 'Lato', sans-serif;
      color: #002fa7;
      background: transparent;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 160px;
      height: 100vh;
      background-color: transparent;
      padding: 20px 10px;
      font-size: 10px;
      overflow-y: auto;
      z-index: 10;
    }

    .sidebar a {
      display: block;
      color: #002fa7;
      text-decoration: none;
      margin-bottom: 6px;
      transition: opacity 0.2s ease;
    }

    .sidebar a:hover {
      opacity: 0.6;
    }

    .main {
      margin-left: 170px;
      padding: 30px 20px;
    }

    .video-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
    }

    .background-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 1s ease-in-out;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(255,255,255,0.7);
      z-index: -1;
    }

    h1 {
      text-transform: uppercase;
      font-size: 24px;
      text-align: center;
      margin: 30px 0;
    }

    .project {
      text-align: center;
      margin-bottom: 60px;
    }

    .project-title {
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .project-description {
      font-size: 33px;
      text-align: left;
      max-width: 800px;
      margin: 20px auto;
      font-weight: bold;
      font-variant: small-caps;
      text-transform: lowercase;
      font-feature-settings: 'lnum' 0;
      line-height: 1.1;
    }

    .photos {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .photos img {
      width: 100%;
      max-width: 750px;
      height: auto;
      cursor: pointer;
    }

    .transparent-image {
      display: block;
      margin: 50px auto 0 auto;
      width: 50%;
      max-width: 300px;
      opacity: 0.9;
    }

    @media screen and (max-width: 768px) {
      .project-description {
        font-size: 18px;
        text-align: center;
        padding: 0 10px;
      }

      .sidebar {
        display: none;
      }

      h1 {
        font-size: 18px;
      }
    }
  </style>
</head>

  <script>
    const videos = [
      "video/video1.m4v",
      "video/video2.m4v",
      "video/video3.m4v",
      "video/video4.m4v",
      "video/video5.m4v"
    ];

    let current = 0;
    const videoEls = [document.getElementById("video1"), document.getElementById("video2")];
    const fadeDuration = 800;

    function switchVideo() {
      const currentEl = videoEls[current % 2];
      const nextEl = videoEls[(current + 1) % 2];

      const nextIndex = (current + 1) % videos.length;
      nextEl.loop = false;
      nextEl.src = videos[nextIndex];
      nextEl.load();

      nextEl.oncanplay = () => {
        nextEl.style.transition = `opacity ${fadeDuration}ms ease-in-out`;
        currentEl.style.transition = `opacity ${fadeDuration}ms ease-in-out`;
        nextEl.style.opacity = 1;
        currentEl.style.opacity = 0;
        nextEl.play();
        current = nextIndex;
      };
    }

    videoEls[0].addEventListener("ended", switchVideo);
    videoEls[1].addEventListener("ended", switchVideo);
    videoEls[0].loop = false;
    videoEls[0].src = videos[0];
    videoEls[0].style.opacity = 1;
    videoEls[0].play();

    fetch("descriptions.json")
      .then(res => {
        if (!res.ok) throw new Error("Fichier descriptions.json introuvable");
        return res.json();
      })
      .then(data => {
        Object.entries(data).reverse().forEach(([key, text]) => {
          const el = document.getElementById("desc-" + key);
          if (el) el.innerHTML = text.replace(/\n/g, "<br>");
          const preview = text.split(" ").slice(0, 2).join(" ");
          const link = document.createElement("a");
          link.href = "#" + key;
          link.textContent = key + " — " + preview;
          document.getElementById("sidebar").appendChild(link);
        });
      })
      .catch(err => {
        const errorBox = document.createElement("div");
        errorBox.style.background = "rgba(255,0,0,0.1)";
        errorBox.style.color = "#b00";
        errorBox.style.padding = "10px";
        errorBox.style.margin = "20px auto";
        errorBox.style.maxWidth = "600px";
        errorBox.style.fontSize = "14px";
        errorBox.style.border = "1px solid #b00";
        errorBox.style.textAlign = "center";
        errorBox.innerText = "⚠️ Erreur : " + err.message;
        document.querySelector(".main").appendChild(errorBox);
      });
  </script>
