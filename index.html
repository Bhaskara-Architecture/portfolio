<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Portfolio vidéo boucle</title>
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; }
    .background-video {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: -2;
      transition: opacity 1s ease-in-out;
    }
    .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(255,255,255,0.7);
      z-index: -1;
    }
    .main {
      position: relative;
      z-index: 1;
      padding: 50px;
      color: #002fa7;
    }
    .project-description {
font-size: 33px;
text-align: left;
max-width: 800px;
margin: 20px auto;
font-weight: bold;
font-variant: small-caps;
text-transform: lowercase;
font-feature-settings: 'lnum' 1;
font-variant-numeric: lining-nums;
line-height: 1.1;
}
  </style>
</head>
<body>
  <video id="video1" class="background-video" autoplay muted playsinline></video>
  <video id="video2" class="background-video" muted playsinline style="opacity: 0;"></video>
  <div class="overlay"></div>

  <div class="main">
    <h1>Bhaskara Architecture</h1>
    <div class="project-description" id="desc-P01">Chargement en cours...</div>
  </div>

  <script>
    const videos = [
      "video/video1.m4v",
      "video/video2.m4v",
      "video/video3.m4v",
      "video/video4.m4v",
      "video/video5.m4v"
    ];

    let current = 0;
    const videoEls = [document.getElementById("video1"), document.getElementById("video2")];
    const fadeDuration = 800;

    function switchVideo() {
      const currentEl = videoEls[current % 2];
      const nextEl = videoEls[(current + 1) % 2];
      const nextIndex = (current + 1) % videos.length;

      nextEl.loop = false;
      nextEl.src = videos[nextIndex];
      nextEl.load();

      nextEl.oncanplay = () => {
        nextEl.style.transition = 'opacity ' + fadeDuration + 'ms ease-in-out';
        currentEl.style.transition = 'opacity ' + fadeDuration + 'ms ease-in-out';
        nextEl.style.opacity = 1;
        currentEl.style.opacity = 0;
        nextEl.play();
        current = nextIndex;
      };
    }

    videoEls[0].addEventListener("ended", switchVideo);
    videoEls[1].addEventListener("ended", switchVideo);
    videoEls[0].loop = false;
    videoEls[0].src = videos[0];
    videoEls[0].style.opacity = 1;
    videoEls[0].play();
  </script>
</body>
</html>
