<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Lato', sans-serif; 
            text-align: left; 
            padding: 20px; 
            background-color: white; /* Fond blanc */
            color: #002fa7; /* Bleu Klein pour le texte */
            position: relative;
            min-height: 100vh;
            cursor: url('images/cursor.png') 32 32, auto; /* Curseur personnalisé */
        }
        h1 { 
            text-transform: uppercase; 
            text-align: left; /* Alignement à gauche comme les autres titres */
            font-size: 96px; /* Augmentation de 4 fois la taille initiale */
            margin-left: 0px; /* Alignement parfait avec les titres */
        }
        .container { 
            display: flex; 
            flex-direction: column; 
            align-items: flex-start; 
        }
        .titles { 
            list-style: none; 
            padding: 0; 
        }
        .titles li { 
            cursor: pointer; 
            margin: 5px 0; /* Réduction de l'espacement initial entre les titres */
            font-weight: bold; 
            position: relative;
            font-size: 10px; /* Réduction de la taille des titres */
        }
        .photos { 
            display: none; 
            margin-top: 5px; /* Réduction de l'espace après ouverture */
        }
        .photos img { 
            width: 500px; /* Taille des images */
            margin: 5px; 
            cursor: pointer; 
            display: block; 
        }
    </style>
</head>
<body>
    <h1>Bhaskara Architecture</h1>
    <div class="container">
        <ul class="titles">
            <li onclick="togglePhotos(1)">P01<div id="photos-1" class="photos"></div></li>
            <li onclick="togglePhotos(2)">P02<div id="photos-2" class="photos"></div></li>
            <li onclick="togglePhotos(3)">P03<div id="photos-3" class="photos"></div></li>
        </ul>
    </div>

    <script>
        let images = {
            1: 5, 2: 10, 3: 13
        };

        function togglePhotos(num) {
            let container = document.getElementById(`photos-${num}`);
            if (!container.hasChildNodes()) {
                container.style.display = "block";
                let imgElement = document.createElement("img");
                imgElement.src = `images/photo${num}_0.jpg`;
                imgElement.setAttribute("data-index", 0);
                imgElement.onclick = function() { nextPhoto(num, imgElement); };
                container.appendChild(imgElement);
            } else {
                container.innerHTML = ""; // Ferme seulement si on reclique sur le titre, pas sur l’image
                container.style.display = "none";
            }
        }

        function nextPhoto(num, imgElement) {
            let index = parseInt(imgElement.getAttribute("data-index"), 10);
            index = (index + 1) % images[num]; // Boucle sur les images du projet
            imgElement.src = `images/photo${num}_${index}.jpg`;
            imgElement.setAttribute("data-index", index);
        }
    </script>
</body>
</html>
