    .overlay {

      top: 0;
      left: 0;

  <script>
    const videos = [
      "video/video1.m4v",
      "video/video2.m4v",
      "video/video3.m4v",
      "video/video4.m4v",
      "video/video5.m4v"
    ];

    let current = 0;
    const videoEls = [document.getElementById("video1"), document.getElementById("video2")];
    const fadeDuration = 800;

    function switchVideo() {
      const currentEl = videoEls[current % 2];
      const nextEl = videoEls[(current + 1) % 2];
      const nextIndex = (current + 1) % videos.length;
      nextEl.loop = false;
      nextEl.src = videos[nextIndex];
      nextEl.load();

      nextEl.oncanplay = () => {
        nextEl.style.transition = `opacity ${fadeDuration}ms ease-in-out`;
        currentEl.style.transition = `opacity ${fadeDuration}ms ease-in-out`;
        nextEl.style.opacity = 1;
        currentEl.style.opacity = 0;
        nextEl.play();
        current = nextIndex;
      };
    }

    videoEls[0].addEventListener("ended", switchVideo);
    videoEls[1].addEventListener("ended", switchVideo);
    videoEls[0].loop = false;
    videoEls[0].src = videos[0];
    videoEls[0].style.opacity = 1;
    videoEls[0].play();

    fetch("descriptions.json")
      .then(res => res.json())
      .then(data => {
        Object.entries(data).reverse().forEach(([key, text]) => {
          const el = document.getElementById("desc-" + key);
          if (el) el.innerHTML = text.replace(/\n/g, "<br>");
          const preview = text.split(" ").slice(0, 2).join(" ");
          const link = document.createElement("a");
          link.href = "#" + key;
          link.textContent = key + " — " + preview;
          document.getElementById("sidebar").appendChild(link);
        });
      });
